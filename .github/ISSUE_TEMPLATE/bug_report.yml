name: Bug report
description: Show me how to reproduce a CodeSocks bug.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Give me the smallest reproduction you can. Keep real proxy credentials, provider keys, secrets, and customer data out of it. Use synthetic values such as `socks5h://user:pass@127.0.0.1:1080`.
  - type: input
    id: version
    attributes:
      label: CodeSocks version
      description: Enter the package version you ran.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the provider, proxy scheme, a redacted `codesocks.jsonc`, and the smallest code sample that triggers it.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the error or describe what happened. Remove sensitive values first.
    validations:
      required: true
