name: Feature request
description: Tell me what CodeSocks is missing.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe what you're trying to do and where CodeSocks gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you'd use.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
